<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naga WebChat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; height: 55vh;
         overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }
  .you { align-self: flex-end; background: #e7f0ff; padding: .4rem .8rem; border-radius: 10px; }
  .naga { align-self: flex-start; background: #f0f0f0; padding: .4rem .8rem; border-radius: 10px;
          white-space: pre-wrap; }
  .sys { align-self: center; color: #888; font-size: .85rem; }
  form { display: flex; gap: .5rem; margin-top: .8rem; }
  input { flex: 1; padding: .5rem; }
  /* 微信绑定面板 */
  .wx { margin-top: 1.2rem; padding: .9rem; border: 1px dashed #ccc; border-radius: 8px; }
  .wx h4 { margin: 0 0 .6rem; }
  .wx img { max-width: 300px; border: 1px solid #eee; border-radius: 4px; background: #fff; }
  .wx .status { margin-top: .6rem; font-size: .9rem; color: #555; }
  #wxBtn { color: #07c160; border: 1px solid #07c160; background: #fff;
           padding: .4rem 1rem; border-radius: 6px; cursor: pointer; }
  #wxUnbind { margin-left: .8rem; color: #c0392b; border: 1px solid #c0392b; background: #fff;
              padding: .4rem 1rem; border-radius: 6px; cursor: pointer; }
  #wxState { margin-left: .8rem; font-size: .9rem; color: #888; }
  .wx-binding { display: flex; align-items: center; gap: .6rem; margin-top: .5rem;
                font-size: .9rem; color: #444; }
  .wx-binding button { color: #c0392b; border: 1px solid #c0392b; background: #fff;
                       padding: .15rem .6rem; border-radius: 6px; cursor: pointer;
                       font-size: .8rem; }
  /* 路由仪表盘面板(M4b 节省仪表盘的 WebChat 视图) */
  details.rt { margin-top: 1.2rem; padding: .6rem .9rem; border: 1px dashed #ccc;
               border-radius: 8px; }
  details.rt summary { cursor: pointer; color: #555; }
  .rt .kv { margin: .5rem 0; font-size: .9rem; }
  .rt table { border-collapse: collapse; font-size: .82rem; margin-top: .4rem; }
  .rt td, .rt th { border: 1px solid #eee; padding: .15rem .5rem; text-align: left; }
  .rt .hint { color: #888; font-size: .85rem; }
  .rt button { color: #07c; border: 1px solid #ccc; background: #fff;
               padding: .15rem .6rem; border-radius: 6px; cursor: pointer;
               font-size: .8rem; margin-left: .6rem; }
</style>
</head>
<body>
<h3>Naga WebChat <span id="state" style="color:#888;font-size:.8rem">connecting…</span></h3>
<div id="log"></div>
<form onsubmit="return send()">
  <input id="goal" placeholder="给 Naga 一个任务…" autocomplete="off">
  <button>发送</button>
</form>

<div class="wx">
  <button id="wxBtn" onclick="wxBind()">📱 绑定微信</button>
  <span id="wxState"></span>
  <div id="wxBindings"></div>
  <div id="wxBox" style="display:none">
    <h4>微信扫码绑定</h4>
    <div><img id="wxQr" alt="绑定二维码"></div>
    <div class="status" id="wxPoll"></div>
  </div>
</div>

<details class="rt" id="routingPanel">
  <summary>🧭 路由仪表盘(M4b:模型自动路由节省)</summary>
  <div class="kv" id="routingBody"><span class="hint">加载中…</span></div>
</details>

<script>
const logEl = document.getElementById("log");
const stateEl = document.getElementById("state");
function log(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
let nextId = 1;
const ws = new WebSocket(`ws://${location.host}/gw`);
ws.onopen = () => ws.send(JSON.stringify({
  type: "hello", proto: "samsara/1", auth: {token: ""},
  device: {id: "webchat", platform: "browser"}, role: "client", caps: []}));
ws.onclose = () => { stateEl.textContent = "disconnected"; log("sys", "连接已断开"); };
ws.onerror = () => log("sys", "连接错误");
ws.onmessage = (m) => {
  const f = JSON.parse(m.data);
  if (f.type === "hello-ok") {
    stateEl.textContent = `connected (${f.trust_level})`;
    log("sys", `已连接:ledger seq ${f.ledger_seq}`);
  } else if (f.type === "res") {
    if (f.ok) log("sys", `已受理:${f.result.trace_id} @ ${f.result.lane}`);
    else log("sys", `错误:${f.error.code} ${f.error.message}`);
  } else if (f.type === "event" && f.event === "agent.completed") {
    log("naga", f.payload.reply ?? `(无回复,${f.payload.outcome})`);
  } else if (f.type === "event" && f.event === "agent.failed") {
    log("naga", `任务失败:${f.payload.failure_analysis ?? f.payload.outcome}`);
  }
};
function send() {
  const goal = document.getElementById("goal").value.trim();
  if (!goal || ws.readyState !== 1) return false;
  log("you", goal);
  document.getElementById("goal").value = "";
  ws.send(JSON.stringify({
    type: "req", id: "r_" + (nextId++), method: "agent.run",
    params: {goal: goal, session_key: "webchat:dm:owner", budget: {tokens: 200000}},
    idempotency_key: "ik_" + crypto.randomUUID()}));
  return false;
}

/* ── 微信扫码绑定(多绑定:可重复发起;每个绑定者可单独解绑) ── */
const wxBtn = document.getElementById("wxBtn");
const wxStateEl = document.getElementById("wxState");
const wxBindingsEl = document.getElementById("wxBindings");
const wxBox = document.getElementById("wxBox");
const wxPollEl = document.getElementById("wxPoll");
let wxPolling = false;

function esc(s) {
  const d = document.createElement("span");
  d.textContent = s;
  return d.innerHTML;
}

async function wxCheck() {
  try {
    const j = await (await fetch("/wechat/status")).json();
    const items = j.bindings ?? [];
    wxStateEl.textContent = items.length
      ? `✓ 已绑定 ${items.length} 个微信` : "未绑定";
    wxStateEl.style.color = items.length ? "#07c160" : "#888";
    wxBindingsEl.innerHTML = "";
    for (const b of items) {
      const row = document.createElement("div");
      row.className = "wx-binding";
      const who = document.createElement("span");
      who.innerHTML = (b.polling ? "🟢 " : "⚪ ")
        + esc(b.binder.length > 18 ? b.binder.slice(0, 16) + "…" : b.binder);
      const btn = document.createElement("button");
      btn.textContent = "解绑";
      btn.onclick = () => wxUnbindOne(b.binder);
      row.append(who, btn);
      wxBindingsEl.appendChild(row);
    }
    if (!items.length) wxBox.style.display = "none";
  } catch (e) { wxStateEl.textContent = "状态查询失败"; }
}

async function wxBind() {
  if (wxPolling) return;
  wxPolling = true;
  wxBox.style.display = "block";
  wxPollEl.textContent = "正在申请二维码…";
  try {
    const r = await fetch("/wechat/bind/start");
    const j = await r.json();
    if (!j.ok) { wxPollEl.textContent = "❌ " + (j.error ?? "获取二维码失败"); wxPolling = false; return; }
    document.getElementById("wxQr").src = j.qr_data_url;   // 服务端本地渲染的 PNG data URL
    wxPollEl.textContent = (j.instruction ?? "用微信扫码") + ";等待扫码…(服务端每次长轮询约 35s)";
    for (let i = 1; i <= 40; i++) {                          // 最多 ~20 分钟
      const pr = await fetch("/wechat/bind/poll/" + encodeURIComponent(j.qrcode));
      const pj = await pr.json();
      if (pj.status === "confirmed") {
        wxPollEl.textContent = "✅ " + (pj.message ?? "绑定成功,消息通道已启动");
        wxCheck();
        wxPolling = false;
        return;
      }
      if (pj.status === "scaned") { wxPollEl.textContent = `已扫码,等待微信确认…(第 ${i} 轮)`; continue; }
      if (pj.status === "expired") {
        wxPollEl.textContent = "⏰ 二维码已过期";
        wxPolling = false;
        return;
      }
      wxPollEl.textContent = `等待扫码…(第 ${i} 轮长轮询)`;
    }
    wxPollEl.textContent = "超时,请点击「绑定微信」重试";
  } catch (e) {
    wxPollEl.textContent = "❌ " + e;
  }
  wxPolling = false;
}

async function wxUnbindOne(binder) {
  if (!confirm(`解绑 ${binder.slice(0, 16)}…?该绑定的消息通道将停止,其他绑定不受影响。`)) return;
  await fetch("/wechat/unbind?binder=" + encodeURIComponent(binder));
  wxCheck();
}

/* ── 路由仪表盘(/routing/stats 的页面视图;未启用则降级提示) ── */
const rtBody = document.getElementById("routingBody");
const rtPanel = document.getElementById("routingPanel");
function rtLine(label, value) {
  const row = document.createElement("div");
  const b = document.createElement("b");
  b.textContent = label + ":";
  row.append(b, " " + value);
  return row;
}
function rtTable(headers, rows) {
  const t = document.createElement("table");
  const head = document.createElement("tr");
  for (const h of headers) {
    const th = document.createElement("th"); th.textContent = h; head.appendChild(th);
  }
  t.appendChild(head);
  for (const cells of rows) {
    const tr = document.createElement("tr");
    for (const c of cells) {
      const td = document.createElement("td"); td.textContent = c; tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  return t;
}
async function routingLoad() {
  rtBody.textContent = "";
  const hint = document.createElement("span");
  hint.className = "hint";
  hint.textContent = "加载中…";
  rtBody.appendChild(hint);
  try {
    const r = await fetch("/routing/stats");
    if (!r.ok) {
      hint.textContent = "路由未启用(daemon 无 /routing/stats)";
      return;
    }
    const j = await r.json();
    rtBody.textContent = "";
    rtBody.appendChild(rtLine("净节省",
      `${j.net_savings_micro_cents} µ¢(毛省 ${j.gross_savings_micro_cents}`
      + ` − 探索 ${j.exploration_spend_micro_cents})`));
    rtBody.appendChild(rtLine("任务数", j.tasks));
    rtBody.appendChild(rtLine("价格表", j.price_table_version));
    if (Object.keys(j.per_model ?? {}).length) {
      rtBody.appendChild(rtTable(
        ["模型", "任务", "影子", "tokens", "实际 µ¢"],
        Object.entries(j.per_model).map(([m, e]) =>
          [m, e.tasks, e.shadow_runs, e.tokens,
           Math.round(e.actual_micro_cents * 1000) / 1000])));
    }
    if ((j.scorecard ?? []).length) {
      const cap = document.createElement("div");
      cap.textContent = "记分卡(簇 × 模型:成功/失败,影子胜/负):";
      rtBody.appendChild(cap);
      rtBody.appendChild(rtTable(
        ["簇", "模型", "成/败", "影子胜/负"],
        j.scorecard.map(([c, m, s, f, w, l]) => [c, m, `${s}/${f}`, `${w}/${l}`])));
    }
  } catch (e) {
    hint.textContent = "查询失败: " + e;
  }
}
rtPanel.addEventListener("toggle", () => { if (rtPanel.open) routingLoad(); });
if (rtPanel.open) routingLoad();

wxCheck();

</script>
</body>
</html>
