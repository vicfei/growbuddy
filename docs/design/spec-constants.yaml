# Samsara 规格常量注册表（spec-constants.yaml）
# 地位：R3 级资产，变更走 RFC（附录 K.0.2）
# 纪律（C1 按类别界定）：可配置的阈值/超时/上限/保留期/配额类数字字面量必须能在此表找到对应条目；
# 示例值、估算值、一次性演示数字豁免注册（估算表须标注"估算"）。主文档引用已注册常量时一律为示意值并带引用脚注。
# 检查器按 (constant_id, value) 对匹配，不按裸值匹配。
# v2：R6-A7 补注册 16 条 + 新增 tbd 占位区（未决占位符先登记，超期升级 §15 纪律）。
# v3：#23 批 RFC 签核（2026-10-11）补注册 11 条——派生域 3 条（权威=主文档 §5.4）、
#      渠道/派生实现默认 8 条（RFC 权威类：authority 以 RFC 起头者以已签核 RFC 文档为权威，
#      裁决记录见 closure-ledger.yaml RFC23-B1）。
# v4：#23 批第二单 RFC 签核（2026-10-18）补注册 17 条——进化/路由/工作流/soak 实现域
#      16 条（RFC 权威类，RFC23-B2）+ workflow_compile_min_uses（权威=主文档 附录 F.1，
#      值在权威节字面在位）。
# v5：#23 批第三单 RFC 签核（2026-10-18）补注册 10 条——记忆域 6 条 + 定时任务域 4 条
#      （RFC 权威类，RFC23-B3）；job_wall_ms_default 权威=主文档 附录 C.2（值字面在位）。

version: 5
constants:

  # ── 接口文档权威域 ──────────────────────────────
  ws_port:
    value: 18789
    authority: 接口设计文档 §2.1
    note: 控制面默认端口，仅回环绑定
  frame_max_bytes:
    value: 1048576            # 1MB
    authority: 接口设计文档 §2.2
    note: 单帧上限；大产物走 CAS 引用
  ledger_inline_payload_max_bytes:
    value: 1024               # 1KB
    authority: 数据模型设计文档 §3.1
    note: 超过则 payload 外置 CAS；与 frame_max_bytes 同形不同义，注意区分
  idempotency_cache_ttl_hours:
    value: 24
    authority: 接口设计文档 §2.2
    note: 幂等去重缓存保留期；持久化于 SQLite（规格缺口 #8 修订）
  ws_heartbeat_interval_sec:
    value: 30
    authority: 接口设计文档 §2.1
  ws_heartbeat_timeout_sec:
    value: 90
    authority: 接口设计文档 §2.1

  # ── 权限模式时效（不一致 #1 裁决：接口文档为唯一权威）──
  mode_full_access_default_ttl_min:
    value: 30
    authority: 接口设计文档 §3.4 mode.set
    note: 默认时效
  mode_full_access_max_ttl_hours:
    value: 4
    authority: 接口设计文档 §3.4 mode.set
    note: 硬上限；姿态预设"效率优先"将其设为 4h（≤上限），主文档 §1.3/B.1 均为示意

  # ── 资产上限（数据模型权威域）─────────────────────
  skill_max_bytes:
    value: 15360              # 15×1024
    authority: 数据模型设计文档 §4 B.1 CHECK
    note: 文档叙述可写"15 KB"，实现以此值为准
  tool_desc_max_chars:
    value: 500
    authority: 接口设计文档 §5.4 ToolPlugin
    note: 防工具投毒（附录 D.2）

  # ── 派生与配额（接口文档权威域）───────────────────
  spawn_depth_soft_limit:
    value: 3
    authority: 接口设计文档 §3.4 spawn
    note: 软限；超出返回 QUOTA.DEPTH_EXCEEDED 需 owner 批准（不一致 #3 裁决）
  spawn_depth_hard_limit:
    value: 5
    authority: 接口设计文档 §3.4 spawn
    note: 硬顶；DB 层 CHECK 兜底

  # ── 隐私与保留（数据模型权威域）───────────────────
  forget_escrow_days:
    value: 30
    authority: 数据模型设计文档 §6（加密擦除）
    note: 加密擦除的密钥托管期 = GDPR 备份刷新窗口（K.6）
  replay_bundle_hot_days:
    value: 90
    authority: 数据模型设计文档 §9
    note: 短于 traces（13 个月）；环境漂移使旧 bundle 重放价值衰减（K.5）
  replay_bundle_step_truncate_bytes:
    value: 10485760           # 10MB
    authority: 接口设计文档 §6.1（trace 契约注释）
    note: 单步输出超限截断并标记 partial:true（K.5）
  review_events_retention_months:
    value: 13
    authority: 数据模型设计文档 §9

  # ── CAS 分层（数据模型权威域）─────────────────────
  cas_sidecar_min_bytes:
    value: 67108864           # 64MB
    authority: 数据模型设计文档 §2 存储拓扑（sidecar 目录）
    note: 超过走旁路存储（Git-LFS 式指针对象）

  # ── 账本与锚定（主文档机制定义，数值权威在此表）───
  ledger_snapshot_every_entries:
    value: 100000
    authority: 数据模型设计文档 §3.2
  hash_anchor_interval_hours:
    value: 24
    authority: 主文档 §10.2
    note: 外部哈希锚定推送间隔
  hash_anchor_missing_alert_after_hours:
    value: 48
    authority: 主文档 §10.2
    note: 锚点缺席告警阈值（心跳语义；critical 事件 trust.anchor_missing）

  # ── 进化机制阈值（主文档机制定义，数值权威在此表）───
  workflow_compile_min_uses:
    value: 50
    authority: 主文档 附录 F.1
  workflow_compile_min_success_rate:
    value: 0.95
    authority: 主文档 附录 F.1
  curator_stale_days:
    value: 30
    authority: 主文档 §6.3
  curator_archive_days:
    value: 90
    authority: 主文档 §6.3
  judge_distill_min_samples:
    value: 5000
    authority: 主文档 附录 E.7
  workspace_capture_overhead_slo_pct:
    value: 10
    authority: 主文档 §12 M3 行（出口标准）
    note: 写捕获 overhead 上限，M3 百并发实测验收

  # ── guest / known 默认预算与限流（A3：接口 §10.1 权威域）──
  guest_task_token_budget:
    value: 50000
    authority: 接口设计文档 §10.1
    note: guest 单任务 token 预算 ≈ 中等任务的 1/3（H.6 设计意图）
  known_task_token_budget:
    value: 500000
    authority: 接口设计文档 §10.1
  guest_concurrent_sessions:
    value: 1
    authority: 接口设计文档 §10.1
  known_concurrent_sessions:
    value: 4
    authority: 接口设计文档 §10.1
  guest_rate_rpm:
    value: 10
    authority: 接口设计文档 §10.1
    note: 另含突发上限 3（burst）
  guest_rate_burst:
    value: 3
    authority: 接口设计文档 §10.1
  known_rate_rpm:
    value: 60
    authority: 接口设计文档 §10.1
  guest_storage_mb:
    value: 100
    authority: 接口设计文档 §10.1
    note: CAS+记忆合计配额
  guest_storage_retention_days:
    value: 7
    authority: 接口设计文档 §10.1
  known_storage_mb:
    value: 10240              # 10GB
    authority: 接口设计文档 §10.1

  # ── R6-A7 补注册（第六轮评审：C1 纪律缺口）──
  curator_cycle_days:
    value: 7
    authority: 主文档 §6.3
    note: Curator 触发周期
  curator_idle_hours:
    value: 2
    authority: 主文档 §6.3
    note: 系统空闲门槛
  gepa_cycle_days:
    value: 7
    authority: 主文档 §7.5
    note: 默认每周、空闲窗口
  gepa_run_cost_cap_cents:
    value: 1000
    authority: 主文档 §7.5
    note: 单次优化运行成本上限（$10）；整数美分纪律（INC2）
  skill_distill_min_tool_calls:
    value: 5
    authority: 主文档 附录 H.4
    note: "5+ 工具调用才触发蒸馏：不为不值得记住的经验付学费"
  lane_max_count:
    value: 8
    authority: 接口设计文档 §2.1
    note: lane 数 = min(CPU 核数, 8)，启动时确定不可变更（GAP9）
  traces_hot_days:
    value: 90
    authority: 数据模型设计文档 §9
  traces_cold_months:
    value: 13
    authority: 数据模型设计文档 §9
  cas_orphan_gc_days:
    value: 90
    authority: 数据模型设计文档 §9
    note: 无引用 CAS blob 的 GC 窗口
  snapshot_keep_recent:
    value: 7
    authority: 数据模型设计文档 §9
  snapshot_keep_monthly:
    value: 1
    authority: 数据模型设计文档 §9
    note: 每月保留 1 个
  asset_chunk_bytes:
    value: 262144            # 256KB
    authority: 接口设计文档 §2.2
    note: 大资产分块上传单块上限（R6-B2）
  asset_upload_session_ttl_hours:
    value: 24
    authority: 数据模型设计文档 §9
    note: 分块上传会话时效；超时未 commit 整体作废、在途分块清除，防在途缓冲绕过 guest 存储配额（R7-N4）
  nfr_recovery_sec:
    value: 60
    authority: 功能说明文档 §4
    note: 崩溃恢复 = 重放账本上限
  nfr_first_token_sec:
    value: 3
    authority: 功能说明文档 §4
    note: 渠道消息首 token 延迟（旗舰档）
  nfr_cost_premium_pct:
    value: 30
    authority: 功能说明文档 §4
    note: 自进化溢价上限/任务（H.4）
  nfr_reconcile_diff_alert_pct:
    value: 5
    authority: 功能说明文档 §4
    note: 双账对账差异告警阈值

  # ── #23 批 RFC 签核 2026-10-11(主文档 §5.4 派生域)──────────────
  spawn_depth_soft_limit:
    value: 3
    authority: 主文档 §5.4
    note: 派生深度软限,超出需 owner 批准(批准记录落 review_events);审批队列 M4
  spawn_depth_hard_cap:
    value: 5
    authority: 主文档 §5.4
    note: INC3 硬顶,不可逾越
  spawn_wall_ms_default:
    value: 120000
    authority: "RFC #23 批(2026-10-11 签核): docs/research/rfc-m2-registry-addendum.md B-8"
    note: R6-B13:墙钟由 L1 Spawner 强制(L0 Budget 不含此字段);默认值为实现期选择
  spawn_child_budget_share:
    value: 0.4
    authority: 主文档 §5.4
    note: §5.4 配额递减树示例:子 ≤ 40% 父剩余;严格小于由 Budget.allocate 强制

  # ── #23 批 RFC 签核 2026-10-11(微信渠道域,RFC 权威类)──────────
  wechat_typing_refresh_sec:
    value: 45
    authority: "RFC #23 批(2026-10-11 签核): docs/research/rfc-m2-registry-addendum.md B-1"
    note: typing status=1 约 60s 自过期,45s 重发留 15s 余量
  wechat_typing_ticket_ttl_sec:
    value: 540
    authority: "RFC #23 批(2026-10-11 签核): docs/research/rfc-m2-registry-addendum.md B-2"
    note: typing_ticket 官方 ~10min,9min 保守续取
  wechat_reply_chunk_chars:
    value: 1900
    authority: "RFC #23 批(2026-10-11 签核): docs/research/rfc-m2-registry-addendum.md B-3"
    note: 单条上限 ~2000 的分段阈值;真实 4705 字 3 段送达实证
  wechat_media_max_bytes:
    value: 20971520
    authority: "RFC #23 批(2026-10-11 签核): docs/research/rfc-m2-registry-addendum.md B-4"
    note: 媒体密文上限(超限拒收;K.7 大对象分层属 M3+)
  wechat_media_download_timeout_sec:
    value: 240
    authority: "RFC #23 批(2026-10-11 签核): docs/research/rfc-m2-registry-addendum.md B-5"
    note: CDN 慢滴流总额限——逐读超时无法约束(460KB 实测拖 197s),须总额限
  wechat_err14_pause_threshold:
    value: 5
    authority: "RFC #23 批(2026-10-11 签核): docs/research/rfc-m2-registry-addendum.md B-6"
    note: 连续 -14(token 失效)→ 暂停渠道并回调重绑
  wechat_poll_backoff_max_sec:
    value: 60
    authority: "RFC #23 批(2026-10-11 签核): docs/research/rfc-m2-registry-addendum.md B-7"
    note: 轮询错误指数退避上限(1s 起)

  # ── #23 批第二单 RFC 签核 2026-10-18(主文档 附录 F.1)───────────
  workflow_compile_min_uses:
    value: 50
    authority: 主文档 附录 F.1
    note: F.1 晋升判据"技能复用 ≥ 50 次"(数据触发,不允许人工冲动编译)

  # ── #23 批第二单 RFC 签核 2026-10-18(进化/路由/工作流/soak 域,RFC 权威类)──
  skill_inject_max_chars:
    value: 2000
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-2"
    note: 技能正文注入系统提示的单条预算(M4a-1 内容注入)
  skill_promotion_trigger_uses:
    value: 3
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-3"
    note: 晋升自动触发:局部技能复用达阈值入管道
  shadow_verify_goals:
    value: 3
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-4"
    note: 影子验证回放目标数上限(§7.4)
  shadow_budget_per_run:
    value: 20000
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-5"
    note: 单次影子回放 token 预算(防跑飞)
  shadow_cost_tolerance:
    value: 1.2
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-6"
    note: 影子裁决成本容差(候选超基线 1.2x 判负)
  gepa_run_token_cap:
    value: 2000000
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-7"
    note: GEPA 单循环 token 二级护栏(价格表生效前;cents 上限已注册)
  gepa_max_clusters:
    value: 3
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-8"
    note: 单次优化循环处理失败聚类数上限(§7.5)
  gepa_cluster_goals:
    value: 2
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-9"
    note: 每聚类影子回放目标数
  shadow_downgrade_wins:
    value: 3
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-10"
    note: 路由降档裁决:影子累计 N 胜且零负(E.4)
  shadow_explore_budget:
    value: 30000
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-11"
    note: 单次路由影子探索回放预算
  shadow_explore_max_pending:
    value: 2
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-12"
    note: 同簇在飞影子回放上限(探索风暴护栏;只计在飞不计完成)
  spawn_min_parent_remaining:
    value: 4000
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-13"
    note: 派生地板:父剩余低于即拒(碎屑配额真 bug 修复,2026-10-11)
  workflow_compile_max_steps_stddev:
    value: 2.0
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-14"
    note: 编译判据:轨迹步数标准差上限(F.1 路径方差低)
  degrade_budget:
    value: 30000
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-15"
    note: F.4 失败降级:解释器接管单节点的独立预算
  soak_heartbeat_sec:
    value: 3600
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-16"
    note: soak 心跳周期(M5)
  soak_disk_min_free_mb:
    value: 512
    authority: "RFC #23-B2 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'-17"
    note: soak 磁盘余量地板(低于即 P0)
  # ── #23 批第三单 RFC 签核 2026-10-18(记忆域,RFC 权威类)──────────
  memory_max_bytes:
    value: 16384
    authority: "RFC #23-B3 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E''-1"
    note: 单条记忆内容上限(§6.5;加密外置 CAS 载荷)
  memory_inject_max_chars:
    value: 2000
    authority: "RFC #23-B3 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E''-1"
    note: 召回注入系统提示的字符预算(§6.5 读取路径)
  memory_recall_limit:
    value: 5
    authority: "RFC #23-B3 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E''-1"
    note: 单次召回条数上限
  memory_distill_min_tool_calls:
    value: 1
    authority: "RFC #23-B3 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E''-1"
    note: 任务收尾提炼门槛(④ 类调用 1 次;有工具动作的事件才值得记)
  memory_consolidate_min_recurrence:
    value: 3
    authority: "RFC #23-B3 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E''-1"
    note: 巩固复现门槛(低频是琐事,高频是偏好;§6.5 睡眠机制)
  memory_consolidate_similarity:
    value: 0.5
    authority: "RFC #23-B3 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E''-1"
    note: 巩固聚类相似度阈值(关键词袋重叠系数,召回导向)

  # ── #23 批第三单 RFC 签核 2026-10-18(定时任务域;wall_ms 权威=附录 C.2)──
  job_scheduler_tick_seconds:
    value: 30
    authority: "RFC #23-B3 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'''-1"
    note: 调度器判定周期(附录 C 运行时;misfire 精度受此粒度限制)
  job_default_budget_tokens:
    value: 200000
    authority: "RFC #23-B3 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'''-1"
    note: 任务默认 token 预算(信任级封顶仍由 §10.1 单点执行)
  job_goal_max_bytes:
    value: 4096
    authority: "RFC #23-B3 批(2026-10-18 签核): docs/research/rfc-m2-registry-addendum.md E'''-1"
    note: 任务 goal 文本上限(CAS 资产)
  job_wall_ms_default:
