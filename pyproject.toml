[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naga"
version = "0.1.0"
description = "Self-evolving AI agent runtime: RSI under tiered authority, reversible ledger, capability security, crash-contained plugins"
requires-python = ">=3.12"  # type 语句(递归类型别名)依赖 3.12;本机与 CI 均为 3.12
dependencies = [
  "zstandard>=0.23",  # 快照 tar.zst(数据模型 §3.2);>=0.23 含类型标注
  "pydantic>=2.5",    # 协议边界模型(Naga 纪律③;磁盘行 LedgerLine)
  "pyyaml>=6",        # SKILL.md frontmatter(主文档 §6.1)
  "httpx>=0.27",      # LLM/搜索适配器异步客户端(M1 批次 2)
  "aiohttp>=3.10",    # WS 网关 + WebChat 静态页(M1 批次 3)
  "segno>=1.6",       # 微信绑定二维码本地生成(M2-W1,不走公网第三方)
  "cryptography>=42", # 微信媒体 AES-128-ECB 解密(M2-W3)
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pyyaml>=6",
]

[project.scripts]
naga = "naga.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# 冻结种子文件,原样平移(docs/design 基线的孪生副本,运行正确性由 pytest T 套件与
# 冻结检查器 R14 把关);lint 只管 src/ 下的演进代码。2026 版 ruff 默认规则集
# 含 I/UP/SIM/BLE/ASYNC,对逐字副本属于噪音,故整体排除而非逐条豁免。
extend-exclude = ["src/naga/kernel.py"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
# 种子内核以文件级注释降级为 basic(见 kernel.py 首行):保持被分析状态,
# 其导出符号对导入方类型可知;重写属后续内核产品化批次,届时删除该注释。

[tool.pytest.ini_options]
testpaths = ["tests"]
