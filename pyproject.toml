[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naga"
version = "0.1.0"
description = "Samsara L0 kernel - Python route (Naga)"
requires-python = ">=3.12"  # type 语句(递归类型别名)依赖 3.12;本机与 CI 均为 3.12
dependencies = [
  "zstandard>=0.23",  # 快照 tar.zst(数据模型 §3.2);>=0.23 含类型标注
  "pydantic>=2.5",    # 协议边界模型(Naga 纪律③;磁盘行 LedgerLine)
  "pyyaml>=6",        # SKILL.md frontmatter(主文档 §6.1)
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pyyaml>=6",
]

[project.scripts]
naga = "naga.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# 冻结种子文件,原样平移(docs/design 基线的孪生副本,运行正确性由 pytest T 套件与
# 冻结检查器 R14 把关);lint 只管 src/ 下的演进代码。2026 版 ruff 默认规则集
# 含 I/UP/SIM/BLE/ASYNC,对逐字副本属于噪音,故整体排除而非逐条豁免。
extend-exclude = ["src/naga/kernel.py"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
# 冻结种子文件豁免(与 ruff extend-exclude 同边界):T16 测试段对
# grant/ctx 的 Optional 访问由运行时前置 assert 保证,类型层不收窄属预期;
# 重写属后续内核产品化批次,届时该豁免取消。演进代码全部受 strict 约束。
exclude = ["src/naga/kernel.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
