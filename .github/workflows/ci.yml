name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pyright
        run: pyright src
      - name: Pytest
        run: pytest -q
      - name: Freeze checker (design baseline)
        run: |
          if [ -f docs/design/freeze_check.py ]; then
            python docs/design/freeze_check.py
          else
            echo "docs/design not present yet, skip"
          fi
